<nz-layout>
  <nz-page-header class="list-header">
    <nz-page-header-title>
      Listado de Usuarios
    </nz-page-header-title>
    <nz-page-header-extra>
      <a routerLink="/home/users/new"> <button nz-tooltip nzTooltipTitle="Nuevo" nz-button nzType="primary"
          nzShape="circle"><i nz-icon nzType="plus" nzTheme="outline"></i></button></a>
    </nz-page-header-extra>
  </nz-page-header>
  <nz-content>
    <nz-collapse>
      <nz-collapse-panel nzSize="small" nzHeader="Filtros">
        <form nz-form (ngSubmit)="search()">
          <div nz-row [nzGutter]="[8,1]">
            <div nz-col nzSpan="24">
              <nz-form-item>
                <nz-form-label>Búsqueda</nz-form-label>
                <nz-form-control>                  
                  <nz-input-group [nzSuffix]="clearQuery">
                    <input [ngModelOptions]="{standalone: true}" type="text" placeholder="Ingrese descripcion o Categoria" nz-input
                      (keydown.enter)="search()" [(ngModel)]="queryData.filter" />
                  </nz-input-group>
                  
                  <ng-template #clearQuery>
                    <i nz-icon class="ant-input-clear-icon" nzTheme="fill" nzType="close-circle"
                      *ngIf="queryData.filter" (click)="queryData.filter = ''; search()"></i>
                  </ng-template>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
        </form>
      </nz-collapse-panel>
    </nz-collapse> 
    <!-- Tabla -->
    <div (scroll)="onScroll($event)"class="table">
      <nz-table class="table-list"  [nzData]="userList" nzBordered=false [nzSize]="'small'" [nzLoading]="loading"
       [nzPageSize]="queryData.pageSize"  nzShowPagination="false">
        <thead>
          <tr>
            <th nzLeft>Nombre</th>
            <th nzLeft>Apellido</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol</th>
            <th nzRight>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of userList; let i= index" class="small-text" tabindex="-1" (click)="onClick(user, i)" (keydown)="myNavegation($event) "
          [style.background-color]="user === selectedUser ? 'lightblue' : ''" 
          (dblclick)="onDoubleClicked(user)">
            <td>{{ user.firstName }}</td>
            <td>{{ user.lastName }}</td>
            <td>{{ user.userName }}</td>
            <td>{{ user.email }}</td>
            <td>{{ this.getRolName(user.roleId) }}</td>
            <td style="text-align: center;">
              <nz-space [nzSplit]="spaceSplit">
                <ng-template #spaceSplit>
                  <nz-divider nzType="vertical"></nz-divider>
                </ng-template> 
                <a *nzSpaceItem (click)="popup.showDeleteConfirmation(user.id)">
                  <i nz-tooltip nzTooltipTitle="Eliminar" nz-icon nzType="delete" [nzTheme]="'twotone'"
                    [nzTwotoneColor]="'#FF0000'"></i>
                </a>
              </nz-space> 
            </td>
          </tr>
        </tbody>
      </nz-table>
    </div>
  </nz-content>
</nz-layout>

<app-popup-confirmation #popup [title]="'Confirmar eliminación'"
  [header]="'¿Está seguro de que desea eliminar el usuario seleccionado?'"
  [message]="'Esta acción no se puede revertir'" (handleOk)="handleOk()">
</app-popup-confirmation>
