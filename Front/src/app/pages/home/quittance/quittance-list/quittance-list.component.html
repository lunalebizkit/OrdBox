<nz-layout>
  <nz-page-header class="list-header">
    <nz-page-header-title>Listado de Recibos</nz-page-header-title>
    <nz-page-header-extra>
      <button
        nz-tooltip
        *authPermission="[
          permissions.CreateQuittance,
          permissions.GetQuittance
        ]"
        nzTooltipTitle="Nuevo"
        nz-button
        nzType="primary"
        nzShape="circle"
        routerLink="/home/quittance/new"
      >
        <i nz-icon nzType="plus" nzTheme="outline"></i>
      </button>
    </nz-page-header-extra>
  </nz-page-header>

  <nz-content>
    <nz-collapse>
      <app-search-custom-filter [customSearchForm]="customQSearchForm" (onSearchCustomClick)="search()"></app-search-custom-filter>  
    </nz-collapse>

    <!-- Tabla -->
    <div class="table" (scroll)="onScroll($event)">
      <nz-table
        class="tabla"
        nzShowSizeChanger
        [nzData]="quittanceList"
        nzBordered="false"
        [nzSize]="'small'"
        [nzLoading]="loading"
        [nzPaginationType]="'small'"
        nzShowPagination="false"
      >
        <thead>
          <tr>
            <th>Número</th>
            <th>Fecha</th>
            <th>Cuit/Cuil</th>
            <th>Nombre</th>
            <th [nzAlign]="'center'">Total</th>
            <th [nzAlign]="'center'">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr
            id="{{ i }}"
            *ngFor="let data of quittanceList; let i = index"
            class="small-text"
            tabindex="-1"
            (click)="onClick(data, i)"
            (keydown)="myNavegation($event)"
            [style.background-color]="
              data === selectedQuittance ? 'lightblue' : ''
            "
            (keydown.enter)="onEnter($event)"
            (dblclick)="onDoubleClicked(data)"
          >
            <td>{{ data.id | number : "8.0-0" | noComma }}</td>
            <td>{{ this.formaterDate(data.dateTime) }}</td>
            <td>{{ data.customerCuit | cuit }}</td>
            <td>{{ data.customerName }}</td>
            <td [nzAlign]="'right'">
              <b>{{ this.currencyFormat(data.total) }}</b>
            </td>
            <td style="text-align: center">
              <a>
                <i
                  nz-icon
                  nzType="eye"
                  style="font-size: 17px; margin-right: 20px"
                  (click)="onDoubleClicked(data)"
                ></i>
              </a>
              <a (click)="reimprimirQuittance(data.id)">
                <i
                  nz-icon
                  nz-tooltip
                  nzTooltipTitle="Descargar pdf"
                  nzType="file-pdf"
                  nzTheme="twotone"
                  [nzTwotoneColor]="'#f5222d'"
                  style="font-size: 16px; margin-right: 2px"
                ></i>
              </a>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </div>
  </nz-content>
</nz-layout>
