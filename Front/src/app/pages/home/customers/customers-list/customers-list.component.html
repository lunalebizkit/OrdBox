<nz-layout>
    <nz-page-header class="list-header">
      <nz-page-header-title>Listado de Clientes</nz-page-header-title>
      <nz-page-header-extra>
        <button nz-tooltip nzTooltipTitle="Nuevo" nz-button nzType="primary"
          nzShape="circle"><i nz-icon nzType="plus" nzTheme="outline" (click)="openComponentCustomerEdit()"></i></button>
      </nz-page-header-extra>
    </nz-page-header>
  
     <nz-content>   
        <nz-collapse>
          <nz-collapse-panel nzSize="small" nzHeader="Filtros">
              <div nz-row [nzGutter]="[8,1]">
                <div nz-col nzSpan="24">
                  <nz-form-item>
                    <nz-form-label>Búsqueda</nz-form-label>
                    <nz-form-control>                  
                      <nz-input-group [nzSuffix]="clearQuery">
                        <input [ngModelOptions]="{standalone: true}" type="text" placeholder="Ingrese Nombre o CUIT-DNI" nz-input
                          (keydown.enter)="search()" [(ngModel)]="queryParams.filter" />
                      </nz-input-group>
                      
                      <ng-template #clearQuery>
                        <i nz-icon class="ant-input-clear-icon" nzTheme="fill" nzType="close-circle"
                          *ngIf="queryParams.filter" (click)="queryParams.filter = ''; search()"></i>
                      </ng-template>
                    </nz-form-control>
                  </nz-form-item>
                </div>
              </div>
          </nz-collapse-panel>
        </nz-collapse> 
  
        <!-- Tabla -->
     
      <div class="table" (scroll)="onScroll($event)">
        <nz-table  class="table-list" [nzData]="entityList" [nzSize]="'small'" [nzLoading]="loading" nzShowPagination="false" [nzScroll]="{ x: '500px' }" >
          <thead>
            <tr>                     
              <th style="width: 100px ; text-align: center">Nombre</th>
              <th style="width: 80px; text-align: center">Dni</th>
              <th style="width: 110px; text-align: center">Cuit</th>
              <th style="text-align: center">Dirección</th>          
              <th style="width: 90px; text-align: center">Teléfono/s</th>       
              <th style="text-align: center">Email/s</th>    
            </tr>
          </thead>
          <tbody>
            <tr #td *ngFor="let data of entityList ; let i = index" class="small-text" tabindex="-1" (click)="onClick(data, i)" (keydown)="myNavegation($event) "
            [style.background-color]="data === selectedCustomers? 'lightblue' : ''" 
            (dblclick)="onDoubleClicked(data)">     
              <td>{{data.name}}</td>
              <td>{{data.dni}}</td>
              <td>{{data.cuit}}</td>
              <td>{{data.address}}</td> 
              <td>{{data.phoneEntity}}</td>
              <td>{{data.emailEntity}}</td>                   
                     
            </tr>
          </tbody>
        </nz-table>
      </div>
     </nz-content> 
  </nz-layout>
