<nz-layout>
  <nz-page-header class="list-header">
    <nz-page-header-title>Listado Nota de Débito</nz-page-header-title>
    <nz-page-header-extra>
      <button *authPermission="[permissions.GetMemo]" 
      nz-tooltip nzTooltipTitle="Nuevo" nz-button nzType="primary" nzShape="circle" routerLink="/notes/debit">
        <i nz-icon nzType="plus" nzTheme="outline"></i>
      </button>
    </nz-page-header-extra>
  </nz-page-header>
  <nz-collapse>
    <app-search-custom-filter [customSearchForm]="customDMSearchForm" (onSearchCustomClick)="search()"></app-search-custom-filter>
  </nz-collapse>

  <nz-divider style="margin: auto"></nz-divider>
  <!-- tabla detalle -->
  <div class="table" (scroll)="onScroll($event)">
    <nz-table class="tabla" nzShowSizeChanger nzBordered="false" [nzData]="debitMemoList" [nzSize]="'small'"
      [nzLoading]="loading" [nzPaginationType]="'small'" nzShowPagination="false">
      <thead>
        <tr>
          <th >Número</th>
          <th >Fecha</th>
          <th >Cuit</th>
          <th >Nombre</th>
          <th [nzAlign]="'center'">Total</th>
          <th [nzAlign]="'center'">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr class="small-text" tabindex="-1" *ngFor="let data of debitMemoList; let i = index"
          (click)="onClick(data, i)" (keydown)="myNavegation($event)" [style.background-color]="
           data === selectedDebitMemo ? 'lightblue' : ''"  (dblclick)="onDoubleClick(data)">
          <td>{{data.invoiceNumber}}</td>
          <td>{{this.formaterDate(data.dateTime)}}</td>
          <td>{{data.customerCuit | cuit}}</td>
          <td>{{data.customerName}}</td>
          <td [nzAlign]="'center'" style="font-weight: bold;">{{ this.currencyFormat( data.total)}}</td>
          <td style="text-align: center">
            <a>
              <i nz-icon nzType="eye" nzTheme="outline" style="font-size: 17px; margin-right: 20px" (click)="onDoubleClicked(data)"></i>
            </a>
            <a (click)="imprimirInvoiceArca(data.id)" *ngIf="data.integrationSuccess == true && data.version == invoiceVersion.Arca">
                <i
                  nz-icon
                  nz-tooltip
                  nzTooltipTitle="Descargar pdf"
                  nzType="file-pdf"
                  nzTheme="twotone"
                  [nzTwotoneColor]="'#24acf2'"
                  style="font-size: 16px; margin-right: 2px"
                ></i>
              </a>
          </td>
        </tr>
      </tbody>
    </nz-table> 
    </div>
</nz-layout>
