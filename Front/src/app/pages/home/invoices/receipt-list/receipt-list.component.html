<nz-layout>
  <nz-page-header class="list-header">
    <nz-page-header-title>Listado de Comprobantes de Compra</nz-page-header-title>
    <nz-page-header-extra>
      <a routerLink="/home/invoices/receipt/new">
        <button
          *authPermission="[permissions.CreateInvoice]"
          nz-tooltip
          nzTooltipTitle="Nuevo"
          nz-button
          nzType="primary"
          nzShape="circle"
        >
          <i nz-icon nzType="plus" nzTheme="outline"></i></button
      ></a>
    </nz-page-header-extra>
  </nz-page-header>

  <nz-content>
    <app-search-custom-filter (onSearchCustomClick)="search()"></app-search-custom-filter>
    <!-- Tabla -->

    <div class="table" (scroll)="onScroll($event)">
      <nz-table
        class="tabla"
        nzShowSizeChanger
        [nzData]="receiptList"
        nzBordered="false"
        [nzSize]="'small'"
        [nzLoading]="loading"
        [nzPaginationType]="'small'"
        nzShowPagination="false"
        nzTableLayout="fixed"
      >
        <thead>
          <tr>
            <th>Número</th>
            <th>Fecha</th>
            <th>Cuit</th>
            <th>Nombre</th>
            <th [nzAlign]="'center'">Total</th>
            <th [nzAlign]="'center'">Tipo</th>
            <th [nzAlign]="'center'">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr
            id="{{ i }}"
            *ngFor="let data of receiptList; let i = index"
            class="small-text"
            tabindex="-1"
            (keydown)="myNavegation($event)"
            [style.background-color]="
              data === selectedReceipt ? 'lightblue' : ''
            "
            (click)="onClick(data, i)"
            (dblclick)="onDoubleClick(data)"
          >
            <td>{{ data.id | number : "8.0-0" | noComma }}</td>
            <td>{{ this.formaterDate(data.dateTime) }}</td>
            <td>{{ data.supplierCuit | cuit }}</td>
            <td>{{ data.supplierName }}</td>
            <td [nzAlign]="'right'">
              <b>{{ this.currencyFormat(data.total) }}</b>
            </td>

            <td [nzAlign]="'center'">{{ data.type | invoiceTypeFilter }}</td>
            <td style="text-align: center">
              <nz-space [nzSplit]="spaceSplit">
                <ng-template #spaceSplit>
                 </ng-template>                
                 <a>
                   <i
                     nz-icon
                     nzType="eye"
                     nzTheme="outline"
                     style="font-size: 16px; margin-right: 20px"
                     (click)="onDoubleClicked(data)"
                   ></i>
                 </a>
                <ng-template #spaceSplit>
                 </ng-template>                
                 <a (click)="reimprimirReceipt(data.id)">
                   <i
                   nz-icon
                   nz-tooltip
                   nzTooltipTitle="Descargar pdf"
                   nzType="file-pdf"
                   nzTheme="twotone"
                   [nzTwotoneColor]="'#f5222d'"
                   style="font-size: 16px; margin-right: 20px"
                 ></i>
                 </a>
                <ng-template #spaceSplit>
                 </ng-template>                
                 <a *nzSpaceItem (click)="popup.showDeleteConfirmation(data.id)">
                   <i nz-tooltip nzTooltipTitle="Eliminar" nz-icon nzType="delete" [nzTheme]="'twotone'"
                     [nzTwotoneColor]="'#FF0000'" style="font-size: 16px;"></i>
                 </a>

              </nz-space>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </div>
  </nz-content>
</nz-layout>

<app-popup-confirmation #popup [title]="'Confirmar eliminación'"
  [header]="'¿Está seguro de que desea eliminar el comprobante seleccionado?'"
  [message]="'Esta acción no se puede revertir'" (handleOk)="handleOk()">
</app-popup-confirmation>
