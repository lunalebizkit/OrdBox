<nz-layout>
  <nz-page-header class="list-header">
      <nz-page-header-title>Reporte de venta</nz-page-header-title>
      <nz-page-header-extra>
        <button
          nz-tooltip
          nzTooltipTitle="Generar Reporte de Venta"
          nz-button
          nzType="primary"
          (click)="msjConfirmOk()"
        >Generar Reporte de Venta
        </button>
      </nz-page-header-extra>
    </nz-page-header>   
    <nz-content >
      <div >

        <nz-collapse>
          <nz-collapse-panel nzHeader="Ventas {{ this.formaterDate(data.invoiceDate) }}" [nzActive]="true" [nzShowArrow]="true" *ngFor="let data of invoicesReportList;">
            <nz-table nzShowPagination="false" style="overflow: auto" [nzData]="data.invoicesReports">
              <tbody>
                <tr *ngFor="let info of data.invoicesReports">
                  <td>{{ this.formaterDate(info.date) }}</td>
                  <td>{{info?.productName}}</td>
                  <td>{{info?.customerName}}</td>
                  <td>{{info?.quantity}}</td>
                  <td>{{info?.subTotal}}</td>
                </tr>
              </tbody>
            </nz-table>
            <tfoot>
              <th>
                <tr>
                  <td></td>
                  <td>Cantidad {{data.totalQuantity}}</td>
                  <td></td>
                  <td>PrecioTotal {{data.totalPrice}}</td>
                  <td></td>
                  <td>SubTotal {{data.totalSubTotal}}</td>
                </tr>
              </th>
            </tfoot>
          </nz-collapse-panel>
        </nz-collapse>
      </div>
    </nz-content>
</nz-layout>

<app-popup-confirmation
  #pop
  [title]="'Confirmar Reporte de Venta'"
  [header]="'¿Está seguro que desea realizar un Reporte de Venta?'"
  [message]="'Esta acción no se puede revertir'"
  (handleOk)="invoicesReport()"

  >
</app-popup-confirmation>
