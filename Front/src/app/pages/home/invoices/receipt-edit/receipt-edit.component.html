<app-header-op-buttons
  #header
  [btnCancelText]="'Volver'"
  [hideSave]="true"
  [hideTag]="false"
  [tagText]="'Factura de compra'"
  [color]="'green'"
  [title]="'Refrigeraciones Dante'"
  [iconBack]="'rollback'"
  [iconUpdate]="'check'"
>
</app-header-op-buttons>

<!-- Encabezado de la Factura -->
<form nz-form [formGroup]="formReceipt">
  <nz-collapse>
    <nz-collapse-panel
      nzHeader="Encabezado"
      [nzActive]="true"
      [nzShowArrow]="true"
    >
      <nz-content>
        <div nz-row nzJustify="center">
          <div nz-col class="gutter-row" [nzSpan]="4" style="margin-right: 5px">
            <nz-form-item>
              <nz-form-label>Fecha</nz-form-label>
              <nz-form-control>
                <nz-date-picker
                  nzFormat="dd/MM/yyyy"
                  [nzDisabledDate]="disabledDate"
                  [nzPlaceHolder]="'Elige una fecha'"
                ></nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col class="gutter-row" style="margin-right: 14px">
            <nz-form-item>
              <nz-form-label>Tipo de Factura</nz-form-label>
              <nz-form-control>
                <nz-select
                  id="type"
                  formControlName="type"
                  [nzOptions]="type"
                  (ngModelChange)="typeSelectedChange($event)"
                >
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div nz-col class="gutter-row" [nzSpan]="8">
            <nz-form-item>
              <nz-form-label>Nro</nz-form-label>
              <nz-form-control>
                <input nz-input maxlength="250" nzSize="small" />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <!-- Datos del Cliente -->
        <nz-divider
          nzText="Proveedor"
          nzOrientation="left"
          style="margin-top: 0"
        ></nz-divider>

        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="14" nzRequired nzFor="supplierCuit"
            >Cuit - Cuil
          </nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="14">
            <input nz-input maxlength="250" nzSize="small" />
          </nz-form-control>

          <!-- Boton que abre el buscador de CLiente en drawer -->
          <form nz-form [formGroup]="formSupplierSearch">
            <div style="margin: 3px">
              <button nz-button nzSize="small" nzType="primary">
                <i nz-icon nzType="search" nzTheme="outline"></i>Buscar
              </button>
            </div>
          </form>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="supplierName"
            >Razón Social - Nombre
          </nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input maxlength="250" nzSize="small" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label
            [nzSm]="6"
            [nzXs]="24"
            nzRequired
            nzFor="supplierAddress"
            >Domicilio
          </nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input nzSize="small" maxlength="250" />
          </nz-form-control>
        </nz-form-item>

        <!-- Buscador de Productos -->
        <nz-divider nzText="Producto" nzOrientation="left"></nz-divider>

        <form nz-form [formGroup]="formProduct">
          <nz-form-item>
            <nz-form-label
              [nzSm]="6"
              [nzXs]="14"
              nzRequired
              nzFor="productSearchFilter"
              >Búsqueda de Producto
            </nz-form-label>
            <nz-form-control [nzSm]="14" [nzXs]="14">
              <nz-input-group [nzSuffix]="clearQuery">
                <input
                  nz-input
                  placeholder="Ingrese Marca, Código, Categoría o Producto"
                  nzSize="small"
                />
              </nz-input-group>

              <ng-template #clearQuery>
                <i
                  nz-icon
                  class="ant-input-clear-icon"
                  nzTheme="fill"
                  nzType="close-circle"
                ></i>
              </ng-template>
            </nz-form-control>
            <div nz-col style="margin: 3px">
              <button nz-button nzSize="small" nzType="primary">
                <i nz-icon nzType="search" nzTheme="outline"></i> Buscar
              </button>
            </div>
          </nz-form-item>
        </form>
        <br />
        <!-- Observaciones-->
        <nz-divider
          nzText="Observaciones"
          nzOrientation="left"
          style="margin-top: 0"
        ></nz-divider>

        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="observation"
            >Observación
          </nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input id="observation" maxlength="250" />
          </nz-form-control>
        </nz-form-item>
      </nz-content>
    </nz-collapse-panel>
  </nz-collapse>
</form>

<!-- Tabla Detalle -->
<nz-collapse>
  <nz-collapse-panel nzHeader="Detalle" [nzActive]="true" [nzShowArrow]="true">
    <nz-content>
      <nz-table
        [nzBordered]="true"
        nzShowPagination="false"
        style="overflow: auto"
        [nzLoading]="loading"
      >
        <thead>
          <tr class="small-text">
            <th>Código</th>
            <th>Código Interno</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unidad</th>
            <th>SubTotal</th>
            <th [nzAlign]="'center'" nzWidth="90px">Iva</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of receiptDetailsList" class="small-text">
            <td>{{ data.productCode }}</td>
            <td>{{ data.productName }}</td>
            <td>
              <div class="editable-cell"></div>
              <nz-input-number
                [nzMin]="1"
                [nzMax]="10000"
                [(ngModel)]="data.quantity"
                (nzBlur)="stopEdit()"
                (ngModelChange)="changeQuantity($event)"
              ></nz-input-number>
            </td>

            <td>
              <div class="editable-cell"></div>
              <nz-input-number [nzMin]="1" [nzMax]="10000"></nz-input-number>
            </td>
            <td [nzAlign]="'right'"></td>
            <td [nzAlign]="'right'"></td>
            <td>
              <div class="editable-cell"></div>
              <nz-input-number [nzMin]="1" [nzMax]="100"></nz-input-number>
            </td>
            <td style="text-align: center">
              <nz-space [nzSplit]="spaceSplit">
                <ng-template #spaceSplit>
                  <nz-divider nzType="vertical"></nz-divider>
                </ng-template>
                <a *nzSpaceItem>
                  <i
                    nz-tooltip
                    nzTooltipTitle="Eliminar"
                    nz-icon
                    nzType="delete"
                    [nzTheme]="'twotone'"
                    [nzTwotoneColor]="'#FF0000'"
                  ></i>
                </a>
              </nz-space>
            </td>
          </tr>
        </tbody>
        <tfoot style="background-color: #fafafa">
          <tr>
            <td colspan="1"><b>Iva </b><b style="color: red"></b></td>
            <td colspan="1"><b>SubTotal </b><b style="color: red"></b></td>
            <td colspan="1">
              <b>Conc. No Gravado</b><b style="color: red"></b>
            </td>
            <td colspan="1"><b>Perc. Iva</b><b style="color: red"></b></td>
            <td colspan="2">
              <b>Perc. Ing. Brutos</b><b style="color: red"></b>
            </td>
            <td colspan="1"><b>Total </b><b style="color: red"></b></td>
            <td colspan="2" [nzAlign]="'left'">
              <button
                id="actualizarbutton"
                nz-button
                nzSize="large"
                style="background-color: #24ce41"
                (click)="pop.showConfirmation()"
              >
                <i nz-icon nzType="save" nzTheme="outline"></i>Grabar
              </button>
            </td>
            <ng-template #elseBlock>
              <td colspan="2"></td>
            </ng-template>
          </tr>
        </tfoot>
      </nz-table>
    </nz-content>
  </nz-collapse-panel>
</nz-collapse>

<app-popup-confirmation
  #popup
  [title]="'Confirmar eliminación'"
  [header]="'¿Está seguro que desea eliminar el producto seleccionado?'"
  [message]="'Esta acción no se puede revertir'"
  (handleOk)="handleOk()"
>
</app-popup-confirmation>
<app-popup-confirmation
  #pop
  [title]="'Confirmar Guardado de comprobante'"
  [header]="'¿Está seguro que desea guardar el comprobante?'"
  [message]="'Esta acción no se puede revertir'"
  (handleOk)="msjConfirmOk()"
>
  >
</app-popup-confirmation>
