
    <form nz-form [formGroup]="formSearch">
        <nz-collapse class="list-header">
            <div nz-col nzSpan="24" style="margin-bottom: -20px;">
                <nz-form-item>
                    <nz-form-label>Clientes</nz-form-label>
                    <nz-form-control>
                        <nz-select class="" nzMode="tags" nzPlaceHolder="Buscar Cliente" nzAllowClear
                            (nzOnSearch)="onSearch($event)" formControlName="supplier">
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </nz-collapse>

        <div>
            <nz-table class="tablaCustomer" nzShowSizeChanger [nzData]="allCustomer" nzBordered=true [nzSize]="'small'"
                [nzLoading]="loading" [nzTotal]="totalItems" [nzPageSize]="queryData.pageSize" [nzPageIndex]="1"
                [nzFrontPagination]="false" [nzPaginationType]="'small'" (nzQueryParams)="onQueryParamsChange($event)">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Cuit</th>
                        <th>Direccion</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let data of allCustomer" class="small-text" (click)="selecccion($event)"
                        id="{{data.id}}">
                        <td>{{data.name}}</td>
                        <td>{{data.cuit}}</td>
                        <td>{{data.address}}</td>
                    </tr>
                </tbody>
            </nz-table>
        </div>
    </form>
