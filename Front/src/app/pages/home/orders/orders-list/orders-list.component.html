<nz-layout>
  <div class="sticky">
    <nz-page-header class="list-header">
      <nz-page-header-title>Listado de Pedidos</nz-page-header-title>
      <nz-page-header-extra>
        <button
          *authPermission="[
            permissions.CreateOrderSupplier,
            permissions.EditOrderSupplier
          ]"
          nz-tooltip
          nzTooltipTitle="Nuevo Pedido"
          nz-button
          nzType="primary"
          nzShape="circle"
          (click)="openComponentOrdersEdit()"
        >
          <i nz-icon nzType="plus" nzTheme="outline"></i>
        </button>
      </nz-page-header-extra>
    </nz-page-header>
  </div>

  <nz-content>
    <nz-collapse>
      <nz-collapse-panel nzSize="small" nzHeader="Filtros" [nzActive]="true">
        <form nz-form [formGroup]="formSearch">
          <div nz-row nzJustify="space-between">
            <div nz-col nzSpan="5">
              <nz-form-item>
                <nz-form-label>Estado</nz-form-label>
                <nz-form-control>
                  <nz-select
                    nzShowSearch
                    nzAllowClear
                    nzPlaceHolder="Estado"
                    id="status"
                    formControlName="status"
                    (ngModelChange)="statusSelectedChange($event)"
                    [nzOptions]="allStatus"
                  >
                  </nz-select>

                  <ng-template #clearQuery>
                    <i
                      nz-icon
                      class="ant-input-clear-icon"
                      nzTheme="fill"
                      nzType="close-circle"
                      *ngIf="formSearch.get('product')?.value"
                      (click)="formSearch.get('product')?.setValue('')"
                    ></i>
                  </ng-template>
                </nz-form-control>
              </nz-form-item>
            </div>
            <div nz-col nzSpan="6" class="mb-2">
              <nz-form-item>
                <nz-form-label nzFor="supplier">Proveedor</nz-form-label>
                <nz-form-control>
                  <nz-select
                    id="supplier"
                    nzPlaceHolder="Seleccione Proveedor"
                    nzAllowClear
                    nzShowSearch
                    formControlName="supplier"
                    (ngModelChange)="supplierSelectedChange($event)"
                    [nzOptions]="allSuppliers"
                  >
                    <ng-template #clearQuery>
                      <i
                        nz-icon
                        class="ant-input-clear-icon"
                        nzTheme="fill"
                        nzType="close-circle"
                        *ngIf="formSearch.get('supplier')?.value"
                        (click)="formSearch.get('supplier')?.setValue([])"
                      ></i>
                    </ng-template>
                  </nz-select>
                </nz-form-control>
              </nz-form-item>
            </div>
            <div nz-col nzSpan="5">
              <nz-form-item>
                <nz-form-label nzFor="category">Categoría </nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24">
                  <nz-spin [nzSpinning]="isLoadingCategory">
                    <nz-select
                      id="category"
                      nzShowSearch
                      nzAllowClear
                      formControlName="category"
                      (ngModelChange)="categorySelectedChange($event)"
                      [nzOptions]="allCategories"
                    >
                    </nz-select>
                    <ng-template #clearQuery>
                      <i
                        nz-icon
                        class="ant-input-clear-icon"
                        nzTheme="fill"
                        nzType="close-circle"
                        *ngIf="formSearch.get('category')?.value"
                        (click)="formSearch.get('category')?.setValue(0)"
                      ></i>
                    </ng-template>
                  </nz-spin>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
          <div nz-row nzJustify="end">
            <div>
              <button nz-button nzType="primary" (click)="search()">
                <i nz-icon nzType="search"></i>
                Buscar
              </button>
            </div>
          </div>
        </form>
      </nz-collapse-panel>
    </nz-collapse>
  </nz-content>
</nz-layout>
<br />

<div class="row">
  <div class="table" (scroll)="onScroll($event)">
    <nz-table
      class="tabla"
      [nzBordered]="false"
      [nzData]="allOrders"
      nzShowPagination="false"
      [nzSize]="'small'"
    >
      <thead>
        <tr>
          <th>N° Pedido</th>
          <th>Fecha</th>
          <th>Proveedor</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr
          id="{{ i }}"
          class="small-text"
          *ngFor="let data of allOrders; let i = index"
          (dblclick)="onDoubleClicked(data)"
          tabindex="-1"
          (click)="onClick(data, i)"
          (keydown)="myNavegation($event)"
          (keydown.enter)="onEnter($event)"
          [style.background-color]="data === selectedOrders ? 'lightblue' : ''"
        >
          <td>{{ data.id }}</td>
          <td>{{ this.formaterDate(data.dateTime) }}</td>
          <td>{{ data.supplierName }}</td>
          <td>{{ this.getStatusName(data.statusId) }}</td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div>
    <nz-table
      class="tabla"
      [nzBordered]="true"
      [nzData]="orderDetailList"
      nzShowPagination="false"
      [nzSize]="'small'"
    >
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
        </tr>
      </thead>
      <tbody>
        <tr class="small-text" *ngFor="let data of orderDetailList">
          <td>{{ data.productId }}</td>
          <td style="text-align: center; font-weight: bold">
            {{ data.orderedQuantity }}
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>
</div>
