<nz-modal>
  <ng-container *nzModalContent>
    <nz-collapse-panel
      nzSize="small"
      nzHeader="Datos de búsqueda"
      [nzActive]="true"
    >
      <form nz-form>
        <div nz-row nzJustify="space-between">
          <div nz-col nzSpan="5">
            <nz-form-item>
              <nz-form-label>Código</nz-form-label>
              <nz-form-control>
                <nz-input-group [nzSuffix]="clearQuery">
                  <input formControlName="product" type="text" nz-input />
                </nz-input-group>

                <ng-template #clearQuery>
                  <i
                    nz-icon
                    class="ant-input-clear-icon"
                    nzTheme="fill"
                    nzType="close-circle"
                  ></i>
                </ng-template>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div nz-col nzSpan="6" class="mb-2">
            <nz-form-item>
              <nz-form-label>Descripción</nz-form-label>
              <nz-form-control>
                <nz-input-group [nzSuffix]="clearQuery">
                  <input formControlName="description" type="text" nz-input />
                </nz-input-group>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
        <div nz-row nzJustify="end">
          <div>
            <button nz-button nzType="primary">
              <i nz-icon nzType="search"></i>
              Buscar
            </button>
          </div>
        </div>
      </form>
    </nz-collapse-panel>
    <nz-table [nzBordered]="true">
      <thead>
        <tr>
          <th>Pedir</th>
          <th>Código</th>
          <th>Marca</th>
          <th>Nombre</th>
          <th>Stock</th>
          <th>Precio de compra</th>
        </tr>
      </thead>
      <tbody>
        <tr class="small-text">
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td style="text-align: center"></td>
        </tr>
      </tbody>
    </nz-table>
  </ng-container>
  <div *nzModalFooter>
    <button nz-button nzType="default" (click)="handleCancel()" nzDanger>
      Cancelar
    </button>
    <button
      nz-button
      nzType="primary"
      (click)="handleOk()"
      [nzLoading]="isConfirmLoading"
    >
      Confirmar
    </button>
  </div>
</nz-modal>
