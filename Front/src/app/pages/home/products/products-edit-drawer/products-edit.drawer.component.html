<app-header-op-buttons #header [btnSaveText]="'Guardar'" [title]="'Producto'" [showSpinner]="isSaving"
    [iconBack]="'rollback'" [iconSave]="'save'" [iconTitle]="'tags'" (onSaveClick)="msjConfirmOk()"
    (onCloseClick)="close()" [hideClose]="true" [hideBack]="true"[hideCerrar]="true" [hideFacturaPro]="true">
</app-header-op-buttons>

<nz-spin [nzSpinning]="isLoading" style="margin-top: 20px;">
    <form nz-form [formGroup]="form" style="margin-top: 16px">
        <nz-collapse>
            <nz-collapse-panel nzHeader="General" [nzActive]="true">
                <nz-content>
                    <!--Nombre-->
                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="description">Descripción
                        </nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24">
                            <input formControlName="description" nz-input id="description" maxlength="250" />
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="code">Código </nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24">
                            <input formControlName="code" nz-input id="code" maxlength="250" />
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="categoryName">Categoría </nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24">
                            <nz-spin [nzSpinning]="isLoadingCategory">
                                <nz-select                              
                                nzAllowClear
                                nzShowSearch
                                nzServerSearch
                                (nzOnSearch)="onSearchCategory($event)"
                                formControlName="categoryName"
                                (nzModelChange)="categorySelectedChange($event)"
                                id="categoryName"
                              >                          
                                <nz-option
                                  *ngFor="let p of allCategories; let id = index"
                                  [nzValue]="p.value"
                                  [nzLabel]="p.label"
                                ></nz-option>
  
                                <nz-option *ngIf="isLoadingCategory" nzDisabled nzCustomContent>
                                  <span
                                    nz-icon
                                    nzType="loading"
                                    class="loading-icon"
                                  ></span>
                                  Loading Data...
                                </nz-option>
                             
                              </nz-select>
                                <!-- <nz-select formControlName="categoryName" id="categoryName"
                                    (nzModelChange)="categorySelectedChange($event)" [nzOptions]="allCategories">
                                </nz-select> -->
                            </nz-spin>
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="brandName">Marca </nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24">
                            <nz-spin [nzSpinning]="isLoadingBrand">
                                <nz-select                              
                                nzAllowClear
                                nzShowSearch
                                nzServerSearch
                                (nzOnSearch)="onSearchBrand($event)"
                                formControlName="brandName"
                                (nzModelChange)="brandSelectedChange($event)"
                                id="brandName"
                              >                          
                                <nz-option
                                  *ngFor="let p of allBrands; let id = index"
                                  [nzValue]="p.value"
                                  [nzLabel]="p.label"
                                ></nz-option>
  
                                <nz-option *ngIf="isLoadingBrand" nzDisabled nzCustomContent>
                                  <span
                                    nz-icon
                                    nzType="loading"
                                    class="loading-icon"
                                  ></span>
                                  Loading Data...
                                </nz-option>
                             
                              </nz-select>
                                <!-- <nz-select formControlName="brandName" id="brandName"
                                    (nzModelChange)="brandSelectedChange($event)" [nzOptions]="allBrands">
                                </nz-select> -->
                            </nz-spin>
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="supplierName">Proveedor </nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24">
                            <nz-spin [nzSpinning]="isLoadingEntity">
                            <nz-select                              
                              nzAllowClear
                              nzShowSearch
                              nzServerSearch
                              (nzOnSearch)="onSearch($event)"
                              formControlName="supplierName"
                              (nzModelChange)="entitySelectedChange($event)"
                              id="supplierName"
                            >                          
                              <nz-option
                                *ngFor="let p of allSuppliers; let id = index"
                                [nzValue]="p.value"
                                [nzLabel]="p.label"
                              ></nz-option>

                              <nz-option *ngIf="isLoadingEntity" nzDisabled nzCustomContent>
                                <span
                                  nz-icon
                                  nzType="loading"
                                  class="loading-icon"
                                ></span>
                                Loading Data...
                              </nz-option>
                           
                            </nz-select>
                        </nz-spin>
                          </nz-form-control>
                 
                    </nz-form-item>
                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="observation">Observación
                        </nz-form-label>
                        <nz-form-control [nzSm]="14" [nzXs]="24">
                            <input formControlName="observation" nz-input id="observation" maxlength="250" />
                        </nz-form-control>
                    </nz-form-item>
                </nz-content>
            </nz-collapse-panel>
        </nz-collapse>
        <nz-collapse>
            <nz-collapse-panel [nzHeader]="'Precio'" [nzActive]="true">
                <nz-content>
                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="pointOrder">Punto Pedido
                        </nz-form-label>
                        <nz-input-number style="width: 120px;" formControlName="pointOrder" id="pointOrder" [nzMin]="0" ></nz-input-number>

                    </nz-form-item>
                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="quantity">Cantidad
                        </nz-form-label>
                        <nz-input-number style="width: 120px;" formControlName="quantity" id="quantity" [nzMin]="0"></nz-input-number>

                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="purchasePrice">Precio Costo
                        </nz-form-label>
                        <nz-input-number style="width: 120px;"  formControlName="purchasePrice" [nzFormatter]="formatterPeso"
                            id="purchasePrice" [nzMin]="0" [nzMax]="10000000" (ngModelChange)="onPrecioCosto($event)">
                        </nz-input-number>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="salePrice">Precio Lista
                        </nz-form-label>
                        <nz-input-number style="width: 120px;" id="salePrice" formControlName="salePrice" [nzMin]="0"
                            [nzFormatter]="formatterPeso"></nz-input-number>

                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="salePercentage">Porcentaje
                        </nz-form-label>
                        <nz-input-number style="width: 120px;"  formControlName="salePercentage" id="salePercentage" [nzMin]="0"
                            (ngModelChange)="valuechange($event)" [nzFormatter]="formatterPorcentaje">
                        </nz-input-number>
                    </nz-form-item>
                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="cashSalePrice">Precio
                            Contado
                        </nz-form-label>
                        <nz-input-number style="width: 120px;"  formControlName="cashSalePrice" id="cashSalePrice"
                            [nzFormatter]="formatterPeso" [nzMin]="0" [nzMax]="10000000"></nz-input-number>

                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="cashSalePercentage">
                            Porcentaje
                            Contado
                        </nz-form-label>
                        <nz-input-number style="width: 120px;" formControlName="cashSalePercentage" id="cashSalePercentage" [nzMin]="0"
                            [nzMax]="10000000" [nzStep]="1" [nzFormatter]="formatterPorcentaje"
                            (ngModelChange)="valuechange($event)"></nz-input-number>
                    </nz-form-item>
                    <nz-form-item>
                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="cardSalePrice">Precio
                            Tarjeta
                        </nz-form-label>
                        <nz-input-number style="width: 120px;" formControlName="cardSalePrice" id="cardSalePrice"
                            [nzFormatter]="formatterPeso" [nzMin]="0" [nzMax]="10000000" [nzStep]="1">
                        </nz-input-number>

                        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="cardSalePercentage">
                            Porcentaje
                            Tarjeta
                        </nz-form-label>
                        <nz-input-number style="width: 120px;"  formControlName="cardSalePercentage" id="cardSalePercentage" [nzMin]="0"
                            [nzMax]="10000000" [nzFormatter]="formatterPorcentaje"
                            (ngModelChange)="valuechange($event)"></nz-input-number>
                    </nz-form-item>
                </nz-content>
            </nz-collapse-panel>
        </nz-collapse>

    </form>
</nz-spin>

<app-popup-confirmation
  #pop
  [title]="'Confirmar Producto'"
  [header]="'¿Está seguro que desea guardar producto?'"
  [message]="'Esta acción no se puede revertir'"
  (handleOk)="save()"
>
</app-popup-confirmation>
