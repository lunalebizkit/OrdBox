<nz-collapse>
    <nz-collapse-panel nzSize="small" nzHeader={{title}}>
        <form nz-form (ngSubmit)="onSearchClick.emit($event)">
            <div nz-row>
                <div nz-col nzSpan="24">
                    <nz-form-item>
                        <nz-form-label nzFor="busqueda">Búsqueda</nz-form-label>
                        <nz-form-control>
                           
                            <nz-input-group nzSearch nzSize="large" [nzSuffix]="clearQuery" [nzAddOnAfter]="suffixButton">
                                <input [ngModelOptions]="{ standalone: true }" type="text"
                                placeholder={{palceHolder}} nz-input (keydown.enter)="onSearchClick.emit($event)"
                                [(ngModel)]="model" (ngModelChange)="onModelChange($event)" id="busqueda" autocomplete="off" />
                            </nz-input-group>
                            <ng-template #suffixButton>
                                <button nz-button nzType="primary" nzSize="large" nzSearch><i nz-icon nzType="search" ></i></button>
                            </ng-template>
                            
                            <ng-template #clearQuery>
                                <i nz-icon class="ant-input-clear-icon" nzTheme="fill" nzType="close-circle"
                                *ngIf="model" (click)="clearInput()"></i>
                            </ng-template>
                        </nz-form-control>
                        </nz-form-item>
                </div>
            </div>
        </form>
    </nz-collapse-panel>
</nz-collapse>
