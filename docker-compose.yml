version: '3'
services:
  api:
    image:  fdufour/biblioteca:api-latest
    restart: always
    expose:
      - 80
    volumes:
      - /home/aedsistemas_ktx/docker-compose-files/front/app/wwwroot/Production:/app/wwwroot/media/doc:rw
      - /home/aedsistemas_ktx/docker-compose-files/front/app/wwwroot/media:/app/wwwroot/media:rw
      - /home/aedsistemas_ktx/docker-compose-files/front/app/PrivateFiles/media:/app/PrivateFiles/media:rw
      - /home/aedsistemas_ktx/docker-compose-files/front/app/logs:/app/logs:rw

  front:
    image: fdufour/biblioteca:front-latest
    restart: always
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
